name: Deploy PR to prod

# Triggers on every push to a PR targeting main. The job is gated by the
# prod environment's required-reviewer rule, so it pauses until approved.
# A "Review deployments" button appears in the PR checks section.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Only one deployment runs at a time. A new push cancels a pending approval
# for the same PR so the button always reflects the latest commit.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply (prod)
        run: |
          terraform -chdir=terraform/prod init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=terraform/prod apply -auto-approve -input=false \
            -var="enable_frontend=true"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deploy frontend SPA
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          BUCKET=$(terraform -chdir=terraform/prod output -raw bucket_name)
          DIST_ID=$(terraform -chdir=terraform/prod output -raw frontend_distribution_id)
          bash scripts/deploy_frontend.sh "$BUCKET" "$DIST_ID" "${API_URL:-}"
