name: Deploy PR to prod

# Triggers on every push to a PR targeting main. The job is gated by the
# prod environment's required-reviewer rule, so it pauses until approved.
# A "Review deployments" button appears in the PR checks section.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Only one deployment runs at a time. A new push cancels a pending approval
# for the same PR so the button always reflects the latest commit.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-prod.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
