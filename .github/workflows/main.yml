name: Main pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write  # for AWS OIDC, granted to the deploy-prod job

concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml

  test:
    uses: ./.github/workflows/reusable-test.yml

  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  commitizen:
    uses: ./.github/workflows/reusable-commitizen.yml
    with:
      mode: push

  deploy-prod:
    needs: [lint, test, frontend, commitizen]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-prod.yml
    with:
      ref: main
