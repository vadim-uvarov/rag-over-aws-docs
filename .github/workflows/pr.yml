name: PR checks

# Run on PRs into any branch so stacked PRs (each targeting the previous one)
# are also checked, not only PRs into main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: pytest
        run: uv run pytest

  commitizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve a base revision to diff this branch against. Normally that is
          # the PR base branch, but a stacked PR whose base was merged and then
          # deleted (or a re-run of a stale event) can point at a branch that no
          # longer exists on origin. Fall back to the base SHA recorded on the PR
          # event, and finally to the latest commit so the check never crashes on
          # a missing revision.
          if git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            range="origin/$BASE_REF..HEAD"
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Checking commit messages in range: $range"
          uv run cz check --rev-range "$range"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive terraform
      # No AWS credentials on PRs, so skip backend init and just validate config.
      - name: Init & validate (bootstrap)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - name: Init & validate (prod)
        run: |
          terraform -chdir=terraform/prod init -backend=false -input=false
          terraform -chdir=terraform/prod validate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        run: npm --prefix frontend run build
