name: PR checks

# Run on PRs into any branch so stacked PRs (each targeting the previous one)
# are also checked, not only PRs into main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml

  test:
    uses: ./.github/workflows/reusable-test.yml

  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  commitizen:
    uses: ./.github/workflows/reusable-commitizen.yml
    with:
      mode: pr

  # Terraform validation is unique to PRs (no AWS creds), so it stays inline.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive terraform
      # No AWS credentials on PRs, so skip backend init and just validate config.
      - name: Init & validate (bootstrap)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - name: Init & validate (prod)
        run: |
          terraform -chdir=terraform/prod init -backend=false -input=false
          terraform -chdir=terraform/prod validate
