name: Reusable - test

# Shared Python test job, imported by main.yml and pr.yml via `jobs.<id>.uses`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: pytest
        run: uv run pytest
