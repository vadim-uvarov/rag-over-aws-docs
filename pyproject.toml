[project]
name = "rag-over-aws-docs"
version = "0.1.0"
description = "This project is a web app that allows you to chat with AI agent about AWS documentation. The agent uses RAG to query the raw AWS documentation stored in the backend."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Vadim Uvarov" }]
license = "MIT"
dependencies = [
    "boto3>=1.43.24",
    "lancedb>=0.33.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "langchain-aws>=1.5.1",
    "langfuse>=4.7.1",
    "llama-index-core>=0.14.22",
    "pyarrow>=24.0.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "commitizen>=4.0",
    "pre-commit>=4.0",
    "moto[dynamodb,s3]>=5.2.2",
    "boto3-stubs[bedrock-runtime,dynamodb,s3,secretsmanager,sqs,stepfunctions]>=1.43.24",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src", "tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific rules
  "N",     # pep8-naming
]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "backend/src"
files = ["backend/src", "tests"]

# These third-party libs ship no type information (and LanceDB has no wheel on
# every dev platform). Treat their imports as untyped rather than failing.
[[tool.mypy.overrides]]
module = ["lancedb.*", "pyarrow.*", "llama_index.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-ra"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
